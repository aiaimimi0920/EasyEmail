name: Reusable Validate

on:
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest

    steps:
      - name: Check Out Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect Documentation-Only Changes
        id: doc_filter
        shell: pwsh
        run: |
          $docsOnly = 'false'
          if ($env:GITHUB_EVENT_NAME -eq 'pull_request' -and $env:GITHUB_BASE_REF) {
            $changed = @(git diff --name-only "origin/$($env:GITHUB_BASE_REF)...HEAD")
            if ($changed.Count -gt 0 -and ($changed | Where-Object { $_ -notmatch '^(docs/.*|README\.md|CHANGELOG\.md|LICENSE|.*\.md)$' }).Count -eq 0) {
              $docsOnly = 'true'
            }
          }
          "docs_only=$docsOnly" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Set Up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - name: Run Fast Documentation Gate
        if: steps.doc_filter.outputs.docs_only == 'true'
        shell: pwsh
        run: node scripts/verify-docs-fast.mjs

      - name: Set Up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Python Dependencies
        shell: pwsh
        run: python -m pip install --disable-pip-version-check pyyaml

      - name: Install and Enable Corepack
        if: steps.doc_filter.outputs.docs_only != 'true'
        shell: pwsh
        run: |
          npm install --global corepack@0.34.6
          corepack enable

      - name: Create Local Operator Config
        if: steps.doc_filter.outputs.docs_only != 'true'
        shell: pwsh
        run: Copy-Item config.example.yaml config.yaml

      - name: Install service/base Dependencies
        if: steps.doc_filter.outputs.docs_only != 'true'
        shell: pwsh
        working-directory: service/base
        run: npm ci

      - name: Install Desktop Dependencies
        if: steps.doc_filter.outputs.docs_only != 'true'
        shell: pwsh
        working-directory: apps/desktop
        run: npm ci

      - name: Check Rust Toolchain
        if: steps.doc_filter.outputs.docs_only != 'true'
        shell: pwsh
        run: |
          rustc --version
          cargo --version

      - name: Install EasyEmail Client Dependencies
        if: steps.doc_filter.outputs.docs_only != 'true'
        shell: pwsh
        working-directory: clients/typescript
        run: npm ci

      - name: Install Cloudflare Worker Dependencies
        if: steps.doc_filter.outputs.docs_only != 'true'
        shell: pwsh
        working-directory: upstreams/cloudflare_temp_email/worker
        run: corepack pnpm install --frozen-lockfile

      - name: Install Cloudflare Frontend Dependencies
        if: steps.doc_filter.outputs.docs_only != 'true'
        shell: pwsh
        working-directory: upstreams/cloudflare_temp_email/frontend
        run: corepack pnpm install --no-frozen-lockfile

      - name: Run Repository Validation
        if: steps.doc_filter.outputs.docs_only != 'true'
        shell: pwsh
        run: ./scripts/test-all.ps1

      - name: Upload Effective Line Report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: easyemail-effective-code-lines
          path: .tmp/effective-code-lines.json
          if-no-files-found: warn
          retention-days: 14

      - name: Validate Release Contract
        shell: pwsh
        run: python scripts/validate-release-contract.py

      - name: Check Tracked File Cleanliness
        shell: pwsh
        run: |
          git diff --check
          git diff --exit-code
